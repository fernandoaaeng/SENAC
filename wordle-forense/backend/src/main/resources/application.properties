quarkus.http.port=8080
quarkus.http.root-path=/

quarkus.http.host=0.0.0.0

# CORS para ng serve. Em Docker o nginx faz proxy (mesma origem).
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.http.cors.headers=accept,authorization,content-type
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=wordle
quarkus.datasource.password=wordle
quarkus.datasource.jdbc.url=jdbc:postgresql://db:5432/wordle

# Tabelas vêm do db/init.sql — não recriar.
quarkus.hibernate-orm.database.generation=none

# --- Logging forense ---
# Access log: IP, método, URI completa (query string), status.
quarkus.http.access-log.enabled=true
quarkus.http.access-log.pattern=%h %t "%r" %s %b
quarkus.http.access-log.log-to-file=true
quarkus.http.access-log.base-file-name=access
quarkus.http.access-log.log-directory=logs

# SQL hibernate + DEBUG da aplicação (query concatenada do login aparece aqui).
quarkus.hibernate-orm.log.sql=true
quarkus.log.level=INFO
quarkus.log.category."br.edu.forense".level=DEBUG
quarkus.log.file.enable=true
quarkus.log.file.path=logs/app.log
quarkus.log.file.rotation.max-file-size=10M
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
