# Wordle Forense — stack local para aula de computação forense.
# App INTENCIONALMENTE VULNERÁVEL. Não exponha na internet fora do horário da aula.
#
# Uso: docker compose up --build
# Frontend (único serviço publicado): http://localhost

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: wordle
      POSTGRES_USER: wordle
      POSTGRES_PASSWORD: wordle
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./logs/postgres:/var/log/postgresql
    command:
      - postgres
      - -c
      - log_statement=all
      - -c
      - log_destination=stderr
      - -c
      - log_line_prefix='%t [%p] %u@%d '
    ports:
      # Só para inspeção local (DBeaver). Não liberar 5432 na nuvem.
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wordle -d wordle"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - wordle-net

  backend:
    build:
      context: ./backend
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/wordle
      QUARKUS_DATASOURCE_USERNAME: wordle
      QUARKUS_DATASOURCE_PASSWORD: wordle
    volumes:
      - ./logs/backend:/deployments/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - wordle-net

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - wordle-net

networks:
  wordle-net:
    driver: bridge
